name: deploy-fevex

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-fevex.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-fevex.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fevex
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.2

jobs:
  validate:
    name: Validate Fevex web
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun --filter @fevex/web typecheck

      - name: Build
        run: bun --filter @fevex/web build

  deploy:
    name: Deploy Fevex web
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: fevex

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun --filter @fevex/web build

      - name: Install deploy SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/fevex-web-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/fevex-web-deploy ~/.ssh/known_hosts

      - name: Upload static release
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          RELEASE: /srv/apps/fevex-web/releases/${{ github.sha }}
        run: |
          ssh -i ~/.ssh/fevex-web-deploy -o IdentitiesOnly=yes "deploy@$VPS_HOST" \
            "mkdir -p '$RELEASE'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/fevex-web-deploy -o IdentitiesOnly=yes" \
            apps/web/dist/ "deploy@$VPS_HOST:$RELEASE/"
          ssh -i ~/.ssh/fevex-web-deploy -o IdentitiesOnly=yes "deploy@$VPS_HOST" \
            "rm -f /srv/apps/fevex-web/current.next && ln -s '$RELEASE' /srv/apps/fevex-web/current.next && mv -Tf /srv/apps/fevex-web/current.next /srv/apps/fevex-web/current"
