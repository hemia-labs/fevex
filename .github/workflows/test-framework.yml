name: Framework validation

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: framework-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Release tooling and changesets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run test:release
      - name: Require changesets for public changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/changesets.mjs check "$BASE_SHA"

  build:
    name: Build packages once
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/release.mjs build "$RUNNER_TEMP/release"
      - run: tar -czf "$RUNNER_TEMP/package-builds.tgz" packages/*/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-builds
          path: ${{ runner.temp }}/package-builds.tgz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  packages:
    name: Package (${{ matrix.package }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: [fevex, browser, deepseek, mcp, openai, openapi, opentelemetry, sqlite]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-builds
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-builds.tgz"
      - env:
          PACKAGE: ${{ matrix.package }}
        run: |
          bun run --cwd "packages/$PACKAGE" typecheck
          bun run --cwd "packages/$PACKAGE" test

  postgres:
    name: PostgreSQL integration
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fevex
          POSTGRES_PASSWORD: fevex_test
          POSTGRES_DB: fevex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fevex -d fevex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FEVEX_POSTGRES_URL: postgresql://fevex:fevex_test@localhost:5432/fevex_test
      FEVEX_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-builds
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-builds.tgz"
      - run: bun run --cwd packages/postgres typecheck
      - run: bun run --cwd packages/postgres test

  examples:
    name: Nest API integration
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-builds
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-builds.tgz"
      - run: bun run --cwd examples/nest-api typecheck
      - run: bun run --cwd examples/nest-api test

  consumers:
    name: Consumers (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/release
      - run: node scripts/release.mjs smoke "$RUNNER_TEMP/release"

  framework:
    name: Framework validation
    if: always()
    needs: [checks, build, packages, postgres, examples, consumers]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: printf '%s' "$RESULTS" | jq -e 'all(.[]; .result == "success")'
