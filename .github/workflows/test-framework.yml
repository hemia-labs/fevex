name: Fevex Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework:
    name: Framework validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fevex
          POSTGRES_PASSWORD: fevex_test
          POSTGRES_DB: fevex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fevex -d fevex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FEVEX_POSTGRES_URL: postgresql://fevex:fevex_test@localhost:5432/fevex_test
      FEVEX_REQUIRE_POSTGRES: '1'

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck and build framework packages
        run: |
          for package in packages/*; do
            bun run --cwd "$package" typecheck
            bun run --cwd "$package" build
          done
          bun run --cwd examples/nest-api typecheck
      - name: Run all source tests with real PostgreSQL
        run: bun run test
